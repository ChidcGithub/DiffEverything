openapi: 3.0.0
info:
  title: Pet API
  version: 1.0.0
paths:
  /pets:
    get:
      responses:
        '200':
          description: ok
    post:
      responses:
        '201':
          description: created
  /health:
    get:
      responses:
        '200':
          description: ok
  /owners:
    post:
      responses:
        '201':
          description: created
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        tag:
          type: string
