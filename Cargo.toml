[workspace]
members = ["crates/diff-core", "crates/diff-cli"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
chardetng = "0.1"
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
plist = "1.10"
quick-xml = "0.42"
rayon = "1"
rpm = { version = "0.30", default-features = false, features = ["payload", "gzip-compression", "xz-compression", "zstd-compression"] }
iso9660 = "0.1"
liblzma = "0.4"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "frame"] }
lzma-rs = "0.3"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
serde = { version = "1", features = ["derive"] }
serde-pickle = "1.2"
serde_json = "1"
similar = "2.7"
tempfile = "3"
thiserror = "2"
walkdir = "2.5"
zip = { version = "2.6", default-features = false, features = [
    "bzip2",
    "deflate",
    "deflate64",
    "lzma",
    "zstd",
] }
zstd = { version = "0.14", default-features = false }
