[workspace]
members = ["crates/diff-core", "crates/diff-cli"]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ChidcGithub/DiffEverything"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
chardetng = "0.1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
encoding_rs = "0.8"
plist = "1.10"
quick-xml = "0.42"
rayon = "1"
rpm = { version = "0.30", default-features = false, features = ["payload", "gzip-compression", "xz-compression", "zstd-compression"] }
iso9660 = "0.1"
liblzma = "0.4"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "frame"] }
lzma-rs = "0.3"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
serde = { version = "1", features = ["derive"] }
serde-pickle = "1.2"
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
snap = "1"
tempfile = "3"
thiserror = "2"
walkdir = "2.5"
zip = { version = "2.6", default-features = false, features = [
    "bzip2",
    "deflate",
    "deflate64",
    "lzma",
    "zstd",
] }
zstd = { version = "0.14", default-features = false }

[profile.release]
# Single shipping profile: thin LTO with parallel codegen keeps the binary
# close to a fat-LTO build while building much faster, and `cargo test
# --release` shares these artifacts, so one dependency tree serves both the
# tested and the published binary.
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
